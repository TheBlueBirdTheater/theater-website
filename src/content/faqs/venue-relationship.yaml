question: "What is the relationship between the Blue Bird Theatre and the OPTP?"
answer: "They're two different things sharing one building: the Blue Bird Theatre is the physical venue downtown, and the Orangeburg Part-Time Players (OPTP) is the volunteer nonprofit that runs it and stages most of its shows. The OPTP's youth program, the Junior Orangeburg Part-Time Players, also performs there each summer."
category: Venue
