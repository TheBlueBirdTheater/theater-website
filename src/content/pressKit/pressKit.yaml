intro: "Resources for journalists and media covering the Blue Bird Theatre and the Orangeburg Part-Time Players — boilerplate, fast facts, and logo assets for reprint."
boilerplate: "The Orangeburg Part-Time Players (OPTP) is an all-volunteer, 501(c)(3) nonprofit community theater company founded in 1981. OPTP operates the historic Blue Bird Theatre in downtown Orangeburg, South Carolina, staging a season of live productions performed by local adult volunteers, and by area youth through its Junior Orangeburg Part-Time Players program."
