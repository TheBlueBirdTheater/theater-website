# base_url is the live Netlify site (see netlify/functions/auth.ts + netlify/functions/callback.ts
# for the OAuth proxy this points at). If this ever moves to a custom domain, update base_url here
# and the GitHub OAuth App's callback URL to match, or login will fail.
backend:
  name: github
  repo: TheBlueBirdTheater/theater-website
  branch: main
  base_url: https://bluebirdtheater.netlify.app/
  auth_endpoint: auth

# Lets editors test against the local git working tree via `npm run cms:local` (decap-server),
# without needing GitHub OAuth. Harmless to leave enabled in production config — Decap only
# uses the local backend when the admin UI itself is opened from localhost.
local_backend: true

# Saves become drafts (Draft -> In Review -> Ready) on their own branch instead of committing
# straight to `branch: main`. Lets editors make and save several changes across sections without
# each save going live, then publish selected entries from the CMS's Workflow board when ready.
publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

# Sidebar order below follows the site's own navigation flow (Home -> Shows -> Auditions ->
# Volunteer -> About -> Rentals -> Contact -> Donate) rather than alphabetical/creation order,
# and groups each page's settings collection next to the content collection that feeds it —
# e.g. Donate Page Settings sits beside Value Propositions, which is the collection that page
# actually pulls its value-prop cards from. Keep new collections near the page they belong to
# rather than appending them at the bottom.
collections:
  - name: siteCopy
    label: Site-Wide Copy
    files:
      - name: siteCopy
        label: Site-Wide Copy
        file: src/content/siteCopy/siteCopy.yaml
        fields:
          - { label: Homepage Hero Eyebrow, name: heroEyebrow, widget: string }
          - { label: Homepage Hero Title, name: heroTitle, widget: string }
          - { label: Homepage Hero Description, name: heroDescription, widget: text }
          - { label: Footer Tagline, name: footerTagline, widget: text }
          - {
              label: Footer Copyright Note,
              name: footerCopyrightNote,
              widget: string,
              hint: 'Appended after "© 1981–{year} Orangeburg Part-Time Players, " in the footer.',
            }
          - { label: Newsletter Eyebrow, name: newsletterEyebrow, widget: string }
          - { label: Newsletter Title, name: newsletterTitle, widget: string }
          - { label: Newsletter Description, name: newsletterDescription, widget: text }
          - {
              label: "Venue Info Strip Title (homepage)",
              name: venueInfoStripTitle,
              widget: string,
            }
          - {
              label: Social Share Image (OG Image),
              name: ogImage,
              widget: image,
              media_folder: /public/images/og,
              public_folder: /images/og,
              required: false,
              hint: "A 1200×630 image for social shares (Facebook/Twitter link previews) on the homepage. Leave blank to use the site's generic default share image.",
            }

  - name: siteSettings
    label: Site Settings
    files:
      - name: siteSettings
        label: Site Settings
        file: src/content/siteSettings/siteSettings.yaml
        fields:
          - {
              label: Ludus Tickets Fallback URL,
              name: ludusFallbackUrl,
              widget: string,
              pattern: ["^https?://", "Must start with http:// or https://"],
              hint: "Where a show or event's 'Get Tickets' button sends people when that specific show doesn't have a Ludus Show ID set yet. Defaults to your Ludus events listing page — only change this if your Ludus account URL changes.",
            }

  - name: shows
    label: Shows
    folder: src/content/shows
    create: true
    slug: "{{slug}}"
    extension: yaml
    format: yaml
    media_folder: /src/assets/images/shows
    public_folder: ../../assets/images/shows
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - { label: Synopsis, name: synopsis, widget: text }
      - {
          label: Meta Description,
          name: metaDescription,
          widget: string,
          required: false,
          pattern: ["^.{0,160}$", "Keep it under 160 characters"],
          hint: "Short description for search results and social shares (~155 characters). Leave blank to auto-generate one from the Synopsis.",
        }
      - { label: Poster Image, name: posterImage, widget: image, required: false }
      - { label: Poster Alt Text, name: posterAlt, widget: string }
      - {
          label: Social Share Image (OG Image),
          name: ogImage,
          widget: image,
          media_folder: /public/images/og,
          public_folder: /images/og,
          required: false,
          hint: "A 1200×630 image for social shares (Facebook/Twitter link previews) — NOT the poster, which is usually the wrong aspect ratio. Leave blank to use the site's generic default share image.",
        }
      - {
          label: Season (Year),
          name: season,
          widget: string,
          pattern: ["^\\d{4}$", "Format: 4-digit year, e.g. 2026"],
          hint: "Which season's program this belongs to — not necessarily the calendar year of its dates (an event just after New Year's can still belong to the prior season). To announce something for next season ahead of time, tag it with next year's number here; it'll get its own page and show under “Coming Next Season” immediately. Entries get archived automatically two seasons after this one.",
        }
      - label: Run Dates
        name: runDates
        widget: list
        hint: "Leave the whole list empty if no dates are set yet (TBA)."
        fields:
          - {
              label: Date,
              name: date,
              widget: string,
              pattern:
                ["^\\d{4}-\\d{2}-\\d{2}$", "Format: YYYY-MM-DD, e.g. 2026-12-10"],
              hint: "Format: YYYY-MM-DD, e.g. 2026-12-10",
            }
          - {
              label: Time,
              name: time,
              widget: string,
              required: false,
              pattern: ["^\\d{2}:\\d{2}$", "Format: HH:mm (24-hour), e.g. 19:30"],
              hint: "Format: HH:mm (24-hour), e.g. 19:30. Leave blank if the time isn't set yet (TBA).",
            }
          - {
              label: Label,
              name: label,
              widget: string,
              required: false,
              hint: 'e.g. "Opening Night", "Matinee"',
            }
          - {
              label: Accessibility Tag,
              name: accessibilityTag,
              widget: string,
              required: false,
              hint: 'e.g. "ASL-Interpreted", "Sensory-Friendly" — leave blank if not applicable to this specific performance.',
            }
      - { label: Venue, name: venue, widget: string }
      - { label: Ticket URL, name: ticketUrl, widget: string }
      - {
          label: Ticket Price,
          name: ticketPrice,
          widget: string,
          required: false,
          hint: 'e.g. "$15" — leave blank if free or not yet set. Shown in ticket search results.',
        }
      - {
          label: Ludus Show ID,
          name: ludusShowId,
          widget: string,
          required: false,
          hint: "Scopes an inline Ludus ticket widget to just this production. Leave blank to skip the inline widget for this show.",
        }
      - {
          label: Dress Code,
          name: dressCode,
          widget: string,
          required: false,
          hint: 'e.g. "Cocktail attire" — leave blank if there is no dress code.',
        }
      - {
          label: Doors Open (minutes before showtime),
          name: doorsOpenMinutesBefore,
          widget: number,
          value_type: int,
          required: false,
          hint: 'e.g. "30" — leave blank if unknown.',
        }
      - {
          label: Run Time,
          name: runTime,
          widget: string,
          required: false,
          hint: 'e.g. "2 hours, incl. one 15-minute intermission" — leave blank if unknown.',
        }
      - {
          label: Concessions Note,
          name: concessionsNote,
          widget: string,
          required: false,
          hint: 'e.g. "Snacks and drinks available in the lobby" — leave blank if not applicable.',
        }
      - label: Accessibility
        name: accessibility
        widget: object
        required: false
        fields:
          - {
              label: Wheelchair-Accessible Seating,
              name: wheelchairSeating,
              widget: boolean,
              default: false,
              required: false,
            }
          - {
              label: Assistive Listening Devices,
              name: assistiveListening,
              widget: boolean,
              default: false,
              required: false,
            }
          - {
              label: ASL Interpretation Available on Request,
              name: aslAvailable,
              widget: boolean,
              default: false,
              required: false,
            }
          - {
              label: Audio Description Available on Request,
              name: audioDescriptionAvailable,
              widget: boolean,
              default: false,
              required: false,
            }
          - {
              label: Additional Note,
              name: note,
              widget: string,
              required: false,
              hint: "Anything not covered above.",
            }
      - label: Auditions
        name: auditions
        widget: object
        required: false
        hint: "Only fill this in if this specific show has its own audition dates. General audition info always shows on the Auditions page separately."
        fields:
          - label: Audition Dates
            name: auditionDates
            widget: list
            required: false
            hint: "Leave empty if audition dates haven't been announced yet (TBA) — the Auditions page will show 'To be announced' until this is filled in."
            fields:
              - {
                  label: Date,
                  name: date,
                  widget: string,
                  pattern:
                    [
                      "^\\d{4}-\\d{2}-\\d{2}$",
                      "Format: YYYY-MM-DD, e.g. 2026-12-10",
                    ],
                  hint: "Format: YYYY-MM-DD, e.g. 2026-12-10",
                }
              - {
                  label: Time,
                  name: time,
                  widget: string,
                  pattern:
                    ["^\\d{2}:\\d{2}$", "Format: HH:mm (24-hour), e.g. 19:30"],
                  hint: "Format: HH:mm (24-hour), e.g. 19:30",
                }
              - {
                  label: Location,
                  name: location,
                  widget: string,
                  required: false,
                }
          - {
              label: Callback Date,
              name: callbackDate,
              widget: string,
              required: false,
              pattern:
                [
                  "^\\d{4}-\\d{2}-\\d{2}$",
                  "Format: YYYY-MM-DD, e.g. 2026-12-10",
                ],
              hint: "Format: YYYY-MM-DD, e.g. 2026-12-10",
            }
          - label: Requirements
            name: requirements
            widget: list
            required: false
            field: { label: Requirement, name: value, widget: string }
          - {
              label: Sign-Up URL,
              name: signUpUrl,
              widget: string,
              required: false,
            }
          - {
              label: Contact Email,
              name: contactEmail,
              widget: string,
              required: false,
            }
          - {
              label: Notes,
              name: notes,
              widget: text,
              required: false,
              hint: 'Anything else auditioners should know, e.g. "Prepare 32 bars of a song."',
            }
      - {
          label: Performing Group,
          name: performingGroup,
          widget: string,
          required: false,
          hint: 'Only needed if this show is NOT an Orangeburg Part-Time Players production. Use "Junior Orangeburg Part-Time Players" for the youth program (tags the show "JR Production"), or another group name for a guest production — e.g. a guest dance recital or comedy night hosted at the Blue Bird Theatre.',
        }
      - {
          label: Director,
          name: director,
          widget: string,
          required: false,
          hint: 'e.g. Coe Dantzler — leave blank if not yet cast/confirmed.',
        }
      - label: Cast
        name: cast
        widget: list
        required: false
        field:
          {
            label: Cast Member,
            name: value,
            widget: string,
            hint: 'e.g. "[Actor Name] as [Character]"',
          }
      - label: Crew
        name: crew
        widget: list
        required: false
        field:
          {
            label: Crew Member,
            name: value,
            widget: string,
            hint: 'e.g. "Director: [Name]"',
          }
      - {
          label: Draft (hide from site),
          name: draft,
          widget: boolean,
          default: false,
          required: false,
          hint: "When on, this entry is hidden from the site entirely (listings, its own page, and the sitemap) without deleting it.",
        }

